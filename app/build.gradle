plugins {
    id 'com.android.application'
}

android {
    namespace 'com.khelobdesports.tournament'
    compileSdk 35

    defaultConfig {
        applicationId 'com.khelobdesports.tournament'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
}
